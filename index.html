<!doctype html>
<!-- 単体起動版: CSS・JavaScriptを内包し、通信なしで動作します。 -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Graphanta - 数学的な思考と表現を支える図・グラフ作成アプリ" />
    <title>Graphanta v0.6.0-alpha.1</title>
  <style>:root {
  font-family: Inter, "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: #20273b;
  background: #edf0f8;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --primary: #5648df;
  --primary-strong: #4034be;
  --primary-soft: #eceaff;
  --accent: #c44ccf;
  --ink: #20273b;
  --muted: #687087;
  --line: #d8ddeb;
  --panel: rgba(255, 255, 255, 0.96);
  --shadow: 0 12px 35px rgba(42, 48, 77, 0.13);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
}

* { box-sizing: border-box; }
html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
button, input, textarea, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid rgba(86, 72, 223, 0.25);
  outline-offset: 1px;
}


.app-shell {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: calc(64px + var(--safe-top)) minmax(0, 1fr);
  padding: 0 var(--safe-right) var(--safe-bottom) var(--safe-left);
  background:
    radial-gradient(circle at 15% 0%, rgba(95, 78, 226, 0.12), transparent 28%),
    radial-gradient(circle at 85% 100%, rgba(197, 76, 207, 0.08), transparent 24%),
    #edf0f8;
}

.menu-bar {
  z-index: 20;
  min-width: 0;
  display: grid;
  grid-template-columns: 44px max-content max-content minmax(150px, 1fr) max-content;
  align-items: center;
  gap: 10px;
  padding: calc(8px + var(--safe-top)) 12px 8px;
  background: rgba(255, 255, 255, 0.95);
  border-bottom: 1px solid rgba(202, 208, 224, 0.9);
  box-shadow: 0 4px 18px rgba(42, 48, 77, 0.06);
  backdrop-filter: blur(16px);
}

.app-mark {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(145deg, #5142d9, #735bfa 56%, #c14bcf);
  box-shadow: 0 7px 18px rgba(81, 66, 217, 0.28);
  cursor: pointer;
}
.app-mark svg { width: 31px; height: 31px; overflow: visible; }
.app-mark path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.app-mark circle { fill: #fff; stroke: rgba(81, 66, 217, .55); stroke-width: 1; }
.app-mark:hover { filter: brightness(1.07); transform: translateY(-1px); }

.wordmark {
  display: grid;
  justify-items: end;
  min-width: 132px;
  padding: 3px 4px;
  border: 0;
  color: #252d43;
  background: transparent;
  cursor: pointer;
  user-select: none;
}
.wordmark strong { font-size: 18px; line-height: 1.05; letter-spacing: .01em; }
.wordmark span { color: var(--muted); font-size: 9px; line-height: 1.2; letter-spacing: .08em; }

.project-title {
  width: 100%;
  min-width: 110px;
  height: 38px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: 9px;
  color: #323a50;
  background: transparent;
  font-weight: 650;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
}
.project-title:hover, .project-title:focus { border-color: var(--line); background: #f8f9fd; }

.menu-actions { display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
.menu-actions button,
.view-control button {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 38px;
  padding: 0 9px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 650;
}
.menu-actions button:hover:not(:disabled), .view-control button:hover { background: #f0f1f8; color: var(--primary-strong); }
.menu-actions button:disabled { opacity: 0.35; cursor: not-allowed; }
.menu-divider { flex: 0 0 auto; width: 1px; height: 24px; margin: 0 2px; background: var(--line); }

.view-control {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  border: 1px solid #dce0ec;
  border-radius: 10px;
  background: #fbfcff;
}
.view-control button { min-height: 32px; padding: 0 8px; }
.view-control output {
  min-width: 42px;
  padding-right: 7px;
  color: #4f5870;
  font-size: 12px;
  font-weight: 750;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.workspace {
  --panel-width: clamp(260px, 19vw, 330px);
  --panel-slot: var(--panel-width);
  min-width: 0;
  min-height: 0;
  display: grid;
  gap: 8px;
  padding: 8px;
  overflow: hidden;
}
.workspace.panels-collapsed { --panel-slot: 44px; }
.workspace.toolbar-right.panels-right {
  grid-template-columns: minmax(360px, 1fr) 58px var(--panel-slot);
  grid-template-areas: "plot tools panels";
}
.workspace.toolbar-left.panels-right {
  grid-template-columns: 58px minmax(360px, 1fr) var(--panel-slot);
  grid-template-areas: "tools plot panels";
}
.workspace.toolbar-right.panels-left {
  grid-template-columns: var(--panel-slot) minmax(360px, 1fr) 58px;
  grid-template-areas: "panels plot tools";
}
.workspace.toolbar-left.panels-left {
  grid-template-columns: var(--panel-slot) 58px minmax(360px, 1fr);
  grid-template-areas: "panels tools plot";
}

.plot-shell {
  grid-area: plot;
  position: relative;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) 28px;
  overflow: hidden;
  border: 1px solid #d8ddea;
  border-radius: 15px;
  background: #fff;
  box-shadow: var(--shadow);
}
.status-bar {
  z-index: 2;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 12px;
  border-top: 1px solid #e1e5ef;
  color: #687087;
  background: #fbfcff;
  font-size: 11px;
  user-select: none;
}
.status-bar > span { min-width: 0; }
.status-bar > span:first-child { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-bar strong { color: #3e465c; }
.status-bar span:last-child { flex: 0 0 auto; color: #778096; }

.plot-viewport { min-width: 0; min-height: 0; overflow: hidden; overscroll-behavior: contain; background: #cdd3e0; touch-action: none; }
.plot-canvas { display: block; width: 100%; height: 100%; background: #fff; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.cursor-select { cursor: default; }
.cursor-pan { cursor: grab; }
.cursor-pen, .cursor-line, .cursor-arrow, .cursor-rectangle, .cursor-ellipse, .cursor-polygon, .cursor-array, .cursor-segment { cursor: crosshair; }
.cursor-text, .cursor-math { cursor: text; }
.selection-outline { fill: none !important; stroke: #6455ea; stroke-width: 1.6; stroke-dasharray: 7 5; }
.object-locked { cursor: not-allowed; }

.toolbar {
  grid-area: tools;
  align-self: stretch;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  padding: 8px 6px;
  border: 1px solid #d9deeb;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 8px 25px rgba(42, 48, 77, 0.09);
  scrollbar-width: thin;
}
.tool-button {
  position: relative;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 43px;
  height: 43px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 11px;
  color: #4a5269;
  background: transparent;
  cursor: pointer;
  touch-action: pan-y;
}
.tool-button:hover:not(:disabled) { color: var(--primary-strong); background: #f1efff; border-color: #ddd8ff; transform: translateY(-1px); }
.tool-button.is-active { color: #fff; background: linear-gradient(145deg, #5749e2, #6b57ef); box-shadow: 0 7px 15px rgba(86,72,223,.27); }
.tool-button:disabled { opacity: .46; cursor: not-allowed; }
.tool-badge { position: absolute; right: -2px; bottom: -2px; padding: 1px 3px; border-radius: 5px; color: white; background: #8c53a8; font-size: 8px; font-weight: 800; }

.side-panels {
  grid-area: panels;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  gap: 8px;
  overflow: hidden;
}
.side-panel {
  width: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  display: grid;
  grid-template-rows: 42px minmax(0,1fr);
  border: 1px solid #d9deeb;
  border-radius: 14px;
  background: var(--panel);
  box-shadow: 0 8px 24px rgba(42, 48, 77, 0.08);
  transition: width .18s ease, box-shadow .18s ease;
}
.panel-heading-wrap {
  position: relative;
  z-index: 8;
  min-width: 0;
  min-height: 0;
}
.side-panel.collapsed {
  width: 44px;
  grid-template-rows: minmax(72px, 1fr);
  justify-self: end;
  align-self: stretch;
}
.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-width: 0;
  padding: 0 13px;
  border: 0;
  border-bottom: 1px solid #e1e5ef;
  color: #2f3850;
  background: linear-gradient(180deg, #fff, #fafbfe);
  cursor: pointer;
  font-weight: 760;
  letter-spacing: .01em;
}
.panel-heading-wrap > .panel-heading { height: 100%; }
.tweak-hint-button {
  position: absolute;
  z-index: 3;
  top: 50%;
  left: 82px;
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 50%;
  color: #756d91;
  background: transparent;
  cursor: pointer;
  transform: translateY(-50%);
}
.tweak-hint-button:hover,
.tweak-hint-button.is-open {
  color: #9a6a0a;
  border-color: #ead28d;
  background: #fff8d9;
  box-shadow: 0 4px 12px rgba(126, 92, 8, .14);
}
.tweak-hint-button:active { transform: translateY(calc(-50% + 1px)) scale(.93); }
.tweak-hint-popover {
  position: absolute;
  z-index: 20;
  top: 37px;
  left: 9px;
  right: 9px;
  padding: 11px 12px;
  border: 1px solid rgba(209, 184, 102, .65);
  border-radius: 11px;
  color: #5c5136;
  background: rgba(255, 252, 235, .98);
  box-shadow: 0 14px 34px rgba(63, 52, 19, .18);
  backdrop-filter: blur(12px);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.65;
  animation: tweak-hint-rise .18s cubic-bezier(.2,.85,.25,1) both;
}
@keyframes tweak-hint-rise {
  from { opacity: 0; transform: translateY(7px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.panel-short { display: none; }
.collapsed .panel-heading {
  height: 100%;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 0;
}
.collapsed .panel-title { display: none; }
.collapsed .panel-short { display: block; color: var(--primary-strong); font-size: 18px; font-weight: 850; }
.collapsed .panel-heading svg { transform: rotate(-90deg); }
.collapsed .tweak-hint-button,
.collapsed .tweak-hint-popover { display: none; }
.panel-content { min-height: 0; overflow-y: auto; padding: 12px; scrollbar-width: thin; }
.panel-hint, .binding-note { margin: 0 0 13px; color: var(--muted); font-size: 12px; line-height: 1.65; }
.binding-note code { color: var(--primary-strong); font-weight: 750; }

.field { display: grid; grid-template-columns: 84px minmax(0,1fr); align-items: center; gap: 8px; margin: 0 0 10px; font-size: 12px; }
.field-label { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 4px; color: #626b81; font-weight: 650; }
.field-label > span:first-child { min-width: 0; }
.field-control { min-width: 0; display: flex; align-items: center; gap: 7px; }
.field-stepper { flex: 0 0 auto; display: inline-grid; grid-template-columns: repeat(2, 18px); gap: 2px; }
.field-stepper button { display: grid; place-items: center; width: 18px; height: 18px; padding: 0; border: 1px solid #d6dbe8; border-radius: 5px; color: #535c73; background: #fff; cursor: pointer; font-size: 12px; font-weight: 800; line-height: 1; }
.field-stepper button:hover:not(:disabled) { color: var(--primary-strong); border-color: #bdb6f3; background: #f5f3ff; }
.field-stepper button:disabled { opacity: .32; cursor: not-allowed; }
.field input:not([type="range"]):not([type="color"]), .field select, .field textarea {
  width: 100%; min-width: 0; border: 1px solid #d7dce8; border-radius: 7px; padding: 7px 8px; background: white; color: #283047;
}
.field textarea { resize: vertical; min-height: 62px; }
.field input[type="color"] { width: 42px; height: 31px; padding: 2px; border: 1px solid #d7dce8; border-radius: 7px; background: white; }
.field input[type="range"] { min-width: 0; width: 100%; accent-color: var(--primary); }
.field output { min-width: 34px; text-align: right; color: #4c5570; font-variant-numeric: tabular-nums; }
.fill-control { width: 100%; justify-content: space-between; }

.toggle { display: flex; align-items: center; gap: 8px; margin: 10px 0; cursor: pointer; font-size: 12px; color: #505970; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle-track { flex: 0 0 auto; width: 36px; height: 20px; padding: 2px; border-radius: 20px; background: #cbd0dc; transition: .18s; }
.toggle-track > span { display: block; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.18); transition: .18s; }
.toggle input:checked + .toggle-track { background: var(--primary); }
.toggle input:checked + .toggle-track > span { transform: translateX(16px); }
.toggle em { font-style: normal; font-weight: 600; }
.toggle.disabled { opacity: .48; cursor: not-allowed; }
.toggle.compact { margin: 0; }
.toggle.compact .toggle-track { width: 31px; height: 18px; }
.toggle.compact .toggle-track > span { width: 14px; height: 14px; }
.toggle.compact input:checked + .toggle-track > span { transform: translateX(13px); }

.selected-type { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; padding: 8px 9px; border-radius: 8px; background: var(--primary-soft); color: #4438b8; font-size: 12px; font-weight: 750; }
.selected-type code { color: #726c95; font-size: 10px; }
.inline-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.inline-actions button, .expression-actions button, .subheading button, .settings-footer button {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 32px; border: 1px solid #d9deea; border-radius: 7px; background: #fff; cursor: pointer; font-size: 11px; font-weight: 650;
}
.inline-actions button:hover, .expression-actions button:hover, .subheading button:hover { border-color: #bdb6f3; color: var(--primary-strong); background: #f7f5ff; }
.danger { color: #a63a4c !important; }
.multi-action-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.multi-action-grid.two-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.multi-action-grid button { min-height: 31px; padding: 4px 6px; border: 1px solid #d9deea; border-radius: 7px; color: #4a5269; background: #fff; cursor: pointer; font-size: 10px; font-weight: 700; }
.multi-action-grid button:hover:not(:disabled) { border-color: #bdb6f3; color: var(--primary-strong); background: #f7f5ff; }
.multi-action-grid button:disabled { opacity: .38; cursor: not-allowed; }

.subheading { display: flex; align-items: center; justify-content: space-between; margin: 3px 0 9px; color: #343d54; font-size: 12px; font-weight: 800; }
.subheading:not(:first-child) { margin-top: 18px; padding-top: 13px; border-top: 1px solid #e2e5ef; }
.subheading button { min-height: 27px; padding: 0 7px; }
.variable-list, .expression-list { display: grid; gap: 8px; }
.variable-card, .expression-card { padding: 9px; border: 1px solid #dfe3ed; border-radius: 9px; background: #fbfcff; }
.variable-head, .expression-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.variable-name { width: 42px; border: 1px solid #d5dae6; border-radius: 6px; padding: 4px; text-align: center; font-weight: 800; }
.variable-head output { flex: 1; text-align: right; color: #4539bd; font-weight: 850; font-variant-numeric: tabular-nums; }
.mini-icon-button { display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; padding: 0; border: 1px solid transparent; border-radius: 7px; color: #687087; background: transparent; cursor: pointer; }
.mini-icon-button:hover { border-color: #d8d3fa; color: var(--primary-strong); background: #f3f1ff; }
.mini-icon-button.is-active { border-color: #cfc8fb; color: var(--primary-strong); background: #ece9ff; }
.mini-icon-button.danger { color: #9c4959 !important; }
.mini-icon-button.danger:hover { border-color: #efc7cf; color: #a43148 !important; background: #fbecef; }
.variable-card > input[type="range"] { width: 100%; accent-color: var(--primary); }
.variable-range { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; margin-top: 5px; }
.variable-range label { display: grid; gap: 2px; color: #757d90; font-size: 9px; }
.variable-range input { width: 100%; min-width: 0; border: 1px solid #dce0e9; border-radius: 5px; padding: 3px; font-size: 10px; }
.expression-label { min-width: 0; flex: 1; border: 0; background: transparent; font-size: 11px; font-weight: 750; }
.expression-plot-badge { flex: 0 0 auto; padding: 2px 5px; border-radius: 999px; color: #716b83; background: #eeecf5; font-size: 8px; font-weight: 800; }
.expression-plot-badge.is-visible { color: #fff; background: #6554e8; }
.expression-plot-badge.is-error { color: #fff; background: #b8465b; }
.expression-plot-badge.is-hidden { color: #667085; background: #e5e7eb; }
.expression-source { width: 100%; border: 1px solid #d5dae6; border-radius: 6px; padding: 6px 7px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
.expression-card.has-error { border-color: #e2a5b0; background: #fffafb; }
.expression-source.is-invalid { border-color: #c34e63; box-shadow: 0 0 0 2px rgba(195, 78, 99, .1); }
.expression-error { margin: 5px 1px 0; color: #a23549; overflow-wrap: anywhere; font-size: 9px; font-weight: 650; line-height: 1.45; }
.expression-preview { min-height: 35px; display: flex; align-items: center; padding: 5px 2px; overflow-wrap: anywhere; color: #242c43; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
.expression-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.expression-actions button:disabled { opacity: .4; cursor: not-allowed; }
.function-placeholder { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; padding: 9px; border: 1px solid #d8d3fa; border-radius: 8px; color: #625b79; background: #f7f5ff; font-size: 10px; }
.function-placeholder > span { min-width: 0; display: grid; gap: 3px; }
.function-placeholder strong { color: #3d347f; font-size: 10px; }
.function-placeholder small { line-height: 1.45; }
.function-placeholder.has-error { border-color: #e2a5b0; color: #874553; background: #fff7f8; }
.function-placeholder.has-error strong { color: #9f3045; }
.function-placeholder code, .function-tool-summary code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.function-tool-summary { display: grid; gap: 5px; margin-bottom: 12px; padding: 10px; border: 1px solid #d8d3fa; border-radius: 9px; color: #625b79; background: #f7f5ff; font-size: 10px; line-height: 1.5; }
.function-tool-summary strong { color: #3d347f; font-size: 11px; }

.function-expression-picker { display: grid; gap: 5px; margin-bottom: 10px; }
.function-expression-picker > button { display: grid; grid-template-columns: 5px minmax(0, 1fr); align-items: stretch; gap: 7px; min-width: 0; min-height: 42px; padding: 5px 7px 5px 5px; border: 1px solid #dfe3ed; border-radius: 8px; color: #4b5368; background: #fff; cursor: pointer; text-align: left; }
.function-expression-picker > button > i { width: 5px; border-radius: 999px; }
.function-expression-picker > button > span { min-width: 0; display: grid; gap: 2px; }
.function-expression-picker strong, .function-expression-picker small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.function-expression-picker strong { color: #30384f; font-size: 10px; }
.function-expression-picker small { color: #70788d; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; }
.function-expression-picker > button:hover { border-color: #c7c0f6; background: #faf9ff; }
.function-expression-picker > button.is-selected { border-color: #9d92ef; background: #f0edff; box-shadow: 0 0 0 2px rgba(86,72,223,.09); }
.function-expression-picker > button.is-hidden { opacity: .62; }
.function-tweak-card { margin-bottom: 12px; }
